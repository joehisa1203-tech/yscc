name: Verify public YSCC JFL football website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 公開先はVPSのnginx。記事の日付と秘密ファイルの非公開を中身で確認する。
      # 以前はトップページに 'JFL 2026' があるかだけを見ていたため、別リポジトリ由来の
      # 古いサイトでも緑になり「公開できている」と誤読させていた。
      - name: Verify the live site
        run: python3 scripts/check_live_site.py "${SITE_BASE_URL:-https://joeai.co.jp/yscc/}"
