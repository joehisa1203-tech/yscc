name: Validate daily blog generation

# 投稿するのはこのVPSのコンテナ（automation/）だけ。ここは「記事生成が壊れて
# いないか」を見る検証専用で、コミットもpushもしない。
# 2026-11-23: push時にActionsがコミットしてVPSのクローンと食い違った。
# publisherが2つあると、片方のpushが拒否され続ける状態に必ず行き着く。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blue-court-daily-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish today's football article and rebuild sitemap
        run: python scripts/daily_blog.py
      - name: Validate football edition (no futsal or F.League crosslinks)
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/matches.json >/dev/null
          python -m json.tool data/posts.json >/dev/null
          if grep -RilE 'ysccfutsal|fleague\.jp|more\.tiget\.net|F\.LEAGUE' index.html app.js scripts/daily_blog.py data blog --include='*.html' --include='*.py' --include='*.js' --include='*.json'; then
            echo 'Old futsal content detected'
            exit 1
          fi
          python -c 'import datetime,json,zoneinfo; today=datetime.datetime.now(zoneinfo.ZoneInfo("Asia/Tokyo")).date().isoformat(); posts=json.load(open("data/posts.json",encoding="utf-8"))["posts"]; assert any(p["date"]==today for p in posts), "No article for " + today; print("Validated article for",today)'
