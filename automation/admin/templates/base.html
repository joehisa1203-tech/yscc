<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>{% block title %}管理画面{% endblock %} | BLUE COURT</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head><body class="admin">
<header class="header"><div class="wrap header-inner">
<a class="brand" href="{{ url_for('dashboard') }}"><span class="brand-symbol"><span class="brand-ball"></span></span><span class="brand-name"><b>BLUE<span>COURT</span><i>.</i></b><small>ADMIN</small></span></a>
{% if g.user %}<div class="admin-user"><span>{{ g.user }}</span>
<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="admin-link" type="submit">ログアウト</button></form></div>{% endif %}
</div></header>
<main class="wrap admin-main">
{% with messages = get_flashed_messages(with_categories=true) %}{% for kind, text in messages %}
<p class="admin-flash {{ kind }}" role="status">{{ text }}</p>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main></body></html>
